<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyễn Quốc Anh Cường</title>
<meta name="description" content="Nguyen Quoc Anh Cuong: research assistant in clinical neuroscience, biology tutor. Research, teaching and the tools I build.">
<meta property="og:title" content="Nguyễn Quốc Anh Cường">
<meta property="og:description" content="Research notebook: clinical neuroscience, posters, teaching and self-study.">
<meta property="og:image" content="https://ngqacuongg.github.io/img/portrait.jpg">
<!-- Newsreader: chữ có chân đủ dấu tiếng Việt, đọc dài không mỏi; số và ngày dùng font mono của máy -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Hướng thiết kế: SỔ TAY PHÒNG LAB.
     Giấy kem kẻ ô mờ, một đường lề hồng như vở thật; ngày tháng và số mục nằm ở lề trái;
     poster, chứng nhận là "Hình N" có chú thích. Không emoji, không gradient, không hiệu ứng phát sáng.
     Hai màu mực lấy từ hình minh hoạ bài giảng Di truyền: xanh (từ bố) và hồng (từ mẹ).
     ============================================================ */
  :root {
    --paper: #f3eee2; --paper-2: #fbf8f1; --ink: #1d2230; --soft: #5a564d; --faint: #8a8476;
    --rule: #d9d0bc; --blue: #284a80; --rose: #b0446a; --grid: rgba(40, 74, 128, .055);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --margin: 150px;   /* bề rộng cột lề trái */
    color-scheme: light;
  }
  :root[data-theme="dark"] {   /* "đèn bàn": giấy sẫm, mực sáng */
    --paper: #1a1916; --paper-2: #23211d; --ink: #e9e3d4; --soft: #b4ac9c; --faint: #8b8475;
    --rule: #3b372f; --blue: #93b3e6; --rose: #e58ca9; --grid: rgba(255, 255, 255, .03);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { margin: 0; color: var(--ink); background-color: var(--paper);
         background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
         background-size: 24px 24px; font: 18px/1.62 var(--serif); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--rose); }
  ::selection { background: rgba(176, 68, 106, .2); }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 28px; }
  .textbtn { font: inherit; color: var(--blue); background: none; border: 0; padding: 0; cursor: pointer;
             text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: left; }
  .textbtn:hover { color: var(--rose); }
  .smallcaps { font-variant-caps: all-small-caps; letter-spacing: .06em; }
  .note { font-size: 15px; font-style: italic; color: var(--soft); }

  /* thanh trên cùng: chỉ là chữ */
  nav { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
  nav .wrap { display: flex; align-items: baseline; gap: 18px; height: 50px; padding-top: 14px; font-size: 16px; }
  nav .who { margin-right: auto; color: var(--ink); text-decoration: none; font-style: italic; }
  nav .who b { font-style: normal; font-weight: 600; }
  nav a, nav .textbtn { font-size: 15px; }

  /* trang giấy: cột lề trái + đường lề hồng */
  .sheet { position: relative; padding-left: calc(var(--margin) + 28px); }
  .sheet::before { content: ""; position: absolute; left: var(--margin); top: 0; bottom: 0; width: 1px; background: var(--rose); opacity: .45; }
  .in-margin { position: absolute; left: 0; width: calc(var(--margin) - 18px); text-align: right; }

  /* trang đầu */
  header.first { padding: 56px 0 40px; }
  .head-grid { display: grid; grid-template-columns: 250px 1fr; gap: 44px; align-items: start; }
  .portrait { margin: 6px 0 0; background: var(--paper-2); padding: 10px 10px 12px; border: 1px solid var(--rule);
              box-shadow: 0 1px 0 var(--rule), 0 14px 26px -22px rgba(0,0,0,.55); transform: rotate(-1.2deg); position: relative; }
  .portrait::before { content: ""; position: absolute; top: -12px; left: 50%; width: 92px; height: 24px; margin-left: -46px;
                      background: rgba(232, 224, 200, .78); border: 1px solid rgba(0,0,0,.05); transform: rotate(2.5deg); }   /* mẩu băng dính */
  :root[data-theme="dark"] .portrait::before { background: rgba(120, 112, 92, .55); }
  .portrait img { display: block; width: 100%; height: auto; }
  .portrait figcaption { margin-top: 8px; font-size: 13px; line-height: 1.4; color: var(--soft); }
  .portrait figcaption b { font-variant-caps: all-small-caps; letter-spacing: .05em; color: var(--ink); }
  .eyebrow { margin: 0; font-style: italic; color: var(--faint); }
  h1 { margin: 6px 0 4px; font-weight: 500; font-size: clamp(38px, 5.4vw, 58px); line-height: 1.05; letter-spacing: -.012em; }
  .role { margin: 0; color: var(--soft); font-variant-caps: all-small-caps; letter-spacing: .07em; font-size: 19px; }
  .lead { margin: 20px 0 0; font-size: 21px; line-height: 1.5; max-width: 34em; }
  .now-line { margin: 16px 0 0; font-size: 16px; color: var(--soft); }
  .now-line b { color: var(--rose); font-weight: 600; font-style: italic; }
  .toc-title { margin: 30px 0 6px; font-size: 15px; color: var(--faint); font-variant-caps: all-small-caps; letter-spacing: .1em; }
  .toc { list-style: none; margin: 0; padding: 0; max-width: 30em; }
  .toc li a { display: flex; align-items: baseline; gap: 10px; color: var(--ink); text-decoration: none; padding: 3px 0; }
  .toc li a:hover { color: var(--rose); }
  .toc .num { font: 13px var(--mono); color: var(--rose); width: 26px; }
  .toc .dots { flex: 1; border-bottom: 1px dotted var(--faint); transform: translateY(-5px); opacity: .7; }
  .head-links { margin: 22px 0 0; font-size: 17px; }

  /* các mục */
  section { padding: 56px 0 48px; border-top: 1px solid var(--rule); }
  .sec-n { top: 6px; font: 13px/1.4 var(--mono); color: var(--rose); }
  .sec-n small { display: block; font: italic 14px var(--serif); color: var(--faint); }
  h2 { margin: 0 0 10px; font-weight: 500; font-size: clamp(28px, 3.6vw, 36px); line-height: 1.15; letter-spacing: -.01em; }
  .intro { margin: 0 0 28px; font-style: italic; color: var(--soft); max-width: 36em; }
  h3.sub { margin: 38px 0 12px; font-size: 18px; font-weight: 600; color: var(--soft); font-variant-caps: all-small-caps; letter-spacing: .08em; }
  .prose { max-width: 36em; }
  .prose p { margin: 0 0 14px; }

  /* 1. mình là ai */
  .lede { font-size: 21px; line-height: 1.55; margin: 0 0 22px; max-width: 34em; }
  .lede::first-letter { float: left; font-size: 3.1em; line-height: .86; padding: 6px 8px 0 0; color: var(--rose); font-weight: 500; }
  dl.facts { display: grid; grid-template-columns: 9.5em 1fr; margin: 0; max-width: 40em; font-size: 16px; border-top: 1px solid var(--rule); }
  dl.facts dt, dl.facts dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  dl.facts dt { color: var(--soft); font-style: italic; }
  dl.roles { margin: 0; max-width: 38em; }
  dl.roles dt { font-weight: 600; margin-top: 12px; }
  dl.roles dd { margin: 2px 0 0; }
  ol.story { list-style: none; counter-reset: st; margin: 0; padding: 0; max-width: 38em; }
  ol.story li { counter-increment: st; position: relative; padding-left: 2.2em; margin-bottom: 20px; }
  ol.story li::before { content: counter(st) "."; position: absolute; left: 0; top: 0; color: var(--rose); font-style: italic; font-size: 20px; }
  ol.story h4 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  ol.story p { margin: 0; }
  blockquote.goal { margin: 34px 0 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--rose); max-width: 34em; }
  blockquote.goal p { margin: 0; font-size: 21px; line-height: 1.5; font-style: italic; }
  blockquote.goal cite { display: block; margin-top: 8px; font: 13px var(--mono); color: var(--faint); font-style: normal; }

  /* 2. hành trình: các trang nhật ký, ngày ở lề */
  ol.log { list-style: none; margin: 0; padding: 0; }
  .entry { position: relative; padding: 18px 0 22px; border-bottom: 1px dashed var(--rule); }
  .entry:last-child { border-bottom: 0; }
  .entry .in-margin { left: calc(-1 * (var(--margin) + 28px)); top: 22px; font: 13px/1.45 var(--mono); color: var(--soft); }
  .entry .in-margin .kind { display: block; font: italic 14px var(--serif); color: var(--faint); }
  .entry.now .in-margin time { color: var(--rose); }
  .entry.later { opacity: .78; }
  .entry h3 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.3; }
  .entry .org { margin: 2px 0 10px; font-style: italic; color: var(--soft); }
  .entry ul { margin: 0; padding-left: 1.1em; max-width: 38em; }
  .entry li { margin-bottom: 4px; }
  .entry li::marker { content: "– "; color: var(--faint); }
  details.attach { margin-top: 12px; }
  details.attach > summary { cursor: pointer; list-style: none; color: var(--blue); font-size: 16px; width: max-content; }
  details.attach > summary::-webkit-details-marker { display: none; }
  details.attach > summary::before { content: "▸ "; color: var(--rose); }
  details.attach[open] > summary::before { content: "▾ "; }
  details.attach > summary:hover { color: var(--rose); }
  .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 20px; margin-top: 16px; }
  ul.alongside { list-style: none; margin: 0; padding: 0; max-width: 40em; }
  ul.alongside li { display: grid; grid-template-columns: 8.5em 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 16px; }
  ul.alongside time { font: 13px var(--mono); color: var(--soft); padding-top: 3px; }

  /* hình có chú thích: poster, chứng nhận, brochure */
  figure.fig { margin: 0; }
  .fig-img { display: block; width: 100%; padding: 6px; background: var(--paper-2); border: 1px solid var(--rule); cursor: zoom-in; }
  .fig-img:hover { border-color: var(--rose); }
  .fig-img img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; }
  .fig-img.landscape img { aspect-ratio: 4 / 3; object-fit: contain; object-position: center; }
  .fig-img.book { cursor: pointer; }
  .fig-img.book img { aspect-ratio: 1; object-fit: contain; background: #d4fbc9; }
  figure.fig figcaption { margin-top: 8px; font-size: 14px; line-height: 1.42; }
  .fig-n { font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: .05em; }
  figure.fig figcaption em { color: var(--soft); }
  .award { display: block; margin-top: 3px; color: var(--rose); font-style: italic; }

  /* 3. nghiên cứu */
  ol.questions { margin: 0; padding-left: 1.6em; max-width: 36em; font-size: 20px; }
  ol.questions li { margin-bottom: 8px; padding-left: 4px; }
  ol.questions li::marker { color: var(--rose); font-style: italic; }
  ul.studies { margin: 0; padding-left: 1.1em; max-width: 38em; }
  ul.studies li::marker { content: "– "; color: var(--faint); }

  /* 4. dạy học: danh sách K như mục lục bài giảng */
  .tally { margin: 6px 0 22px; font-style: italic; color: var(--soft); }
  .tools-line { margin: 0 0 6px; font-size: 15px; text-align: right; max-width: 44em; }
  ol.klist { list-style: none; margin: 0; padding: 0; max-width: 44em; border-top: 1px solid var(--rule); }
  ol.klist > li { border-bottom: 1px dashed var(--rule); }
  ol.klist summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 8px; padding: 10px 0; }
  ol.klist summary::-webkit-details-marker { display: none; }
  ol.klist summary::after { content: "+"; color: var(--faint); }
  ol.klist details[open] summary::after { content: "–"; }
  ol.klist summary:hover { color: var(--rose); }
  ol.klist .k { font: 14px/1.9 var(--mono); color: var(--rose); }
  dl.kfiles { display: grid; grid-template-columns: 8.5em 1fr; gap: 6px 14px; margin: 0 0 16px 3.7em; font-size: 16px; }
  dl.kfiles dt { color: var(--soft); font-style: italic; }
  dl.kfiles dd { margin: 0; }
  dl.kfiles .sep { color: var(--faint); }
  ol.ab { list-style: none; margin: 0; padding: 0; }
  ol.ab li { display: grid; grid-template-columns: 3.4em 1fr; }
  ol.ab b { font: 12px/2 var(--mono); color: var(--faint); font-weight: 400; }

  /* 5. tự học */
  .topic { max-width: 40em; margin-bottom: 34px; }
  .topic h3 { margin: 0; font-size: 22px; font-weight: 600; }
  .topic .org { margin: 2px 0 8px; font-style: italic; color: var(--soft); }
  .topic p { margin: 0 0 8px; }
  ul.links { list-style: none; margin: 0; padding: 0; }
  ul.links li { padding: 3px 0; }
  ul.links .type { font-style: italic; color: var(--faint); font-size: 15px; }

  /* 6. học code */
  details.course { max-width: 44em; border-bottom: 1px dashed var(--rule); }
  details.course > summary { cursor: pointer; list-style: none; padding: 10px 0; }
  details.course > summary::-webkit-details-marker { display: none; }
  details.course > summary b { font-weight: 600; }
  details.course > summary b::after { content: " +"; color: var(--faint); font-weight: 400; }
  details.course[open] > summary b::after { content: " –"; }
  details.course > summary small { display: block; color: var(--soft); font-size: 16px; }
  .ago { font: 12px var(--mono); color: var(--faint); }
  ol.nb { margin: 0 0 8px; padding-left: 1.4em; font-size: 16px; }
  .repo-link { display: inline-block; margin: 0 0 14px; font: 13px var(--mono); }
  ul.tools { list-style: none; margin: 0; padding: 0; max-width: 44em; }
  ul.tools li { padding: 8px 0; border-bottom: 1px solid var(--rule); }
  ul.tools b { font-weight: 600; }
  ul.tools .links-inline { font-size: 15px; white-space: nowrap; }
  ol.commits { list-style: none; margin: 0; padding: 0; max-width: 44em; font-size: 15px; }
  ol.commits li { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 12px; padding: 5px 0; border-bottom: 1px dotted var(--rule); }
  ol.commits code { font: 13px var(--mono); color: var(--rose); }
  ol.commits time { font: 12px var(--mono); color: var(--faint); white-space: nowrap; }
  .gh-line { font-style: italic; color: var(--soft); margin: 0 0 8px; }

  /* 7. kỹ năng, 8. liên hệ */
  dl.skills { display: grid; grid-template-columns: 11em 1fr; gap: 10px 18px; margin: 0; max-width: 44em; }
  dl.skills dt { font-style: italic; color: var(--soft); }
  dl.skills dd { margin: 0; }
  .contact-big { font-size: clamp(22px, 2.6vw, 27px); line-height: 1.45; margin: 0 0 18px; max-width: 30em; }
  ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 26px; }
  footer { padding: 30px 0 48px; border-top: 1px solid var(--rule); font: 13px var(--mono); color: var(--faint); }

  /* cửa sổ: video, ảnh lớn, brochure */
  dialog { color: var(--ink); }
  .icon-btn { font: 16px var(--serif); color: var(--ink); background: var(--paper-2); border: 1px solid var(--rule); width: 34px; height: 34px; cursor: pointer; }
  .icon-btn:hover { color: var(--rose); border-color: var(--rose); }
  /* cửa sổ brochure */
  #bookDlg { width: min(960px, 96vw); max-height: 94vh; overflow: auto; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-2); color: var(--ink); padding: 20px 22px 22px; }
  #bookDlg::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  .book-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .book-head h4 { margin: 0; font: 400 22px/1.25 var(--serif); }
  .book-text { margin: 6px 0 4px; color: var(--soft); font-size: 14px; max-width: 760px; }
  .sheets { display: none; gap: 14px; padding: 14px 0 18px; }
  .sheets figure { margin: 0; }
  .sheets figcaption { font: 12px var(--mono); color: var(--soft); margin-top: 4px; }
  .book-stage[data-sheets="true"] .book-wrap { display: none; }
  .book-stage[data-sheets="true"] .sheets { display: grid; }
  /* brochure lật trang */
  .book-wrap { perspective: 2000px; overflow: hidden; padding: 14px 0 18px; }
  .book { position: relative; width: min(100%, 860px); aspect-ratio: 2 / 1; margin: 0 auto; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.4, .1, .2, 1); }
  .book[data-at="0"] { transform: translateX(-25%); }               /* đang đóng: đưa bìa ra giữa */
  .book[data-end="true"] { transform: translateX(25%); }            /* lật hết: đưa trang cuối ra giữa */
  .leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.4, .1, .2, 1); cursor: pointer; }
  .leaf.flipped { transform: rotateY(-180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          background-size: 400% 100%; background-repeat: no-repeat; background-color: #e9f5e4;
          box-shadow: 0 6px 22px -10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.06); }
  .face.front { border-radius: 0 8px 8px 0; }
  .face.back { transform: rotateY(180deg); border-radius: 2px 0 0 8px; }
  .face::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9%; pointer-events: none; }     /* bóng ở gáy sách */
  .face.front::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.16), transparent); }
  .face.back::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
  .book-nav { display: flex; align-items: center; justify-content: center; gap: 16px; font: 13px var(--mono); color: var(--soft); text-align: center; }
  .book-nav button { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .book-nav button:hover:not(:disabled) { border-color: var(--rose); color: var(--rose); }
  .book-nav button:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .book, .leaf { transition: none; } }
  #lb { padding: 0; border: 0; background: none; max-width: 96vw; max-height: 94vh; overflow: auto; cursor: zoom-out; border-radius: 2px; }
  #lb::backdrop { background: rgba(0,0,0,.8); }
  #lb img { display: block; max-width: min(1200px, 96vw); height: auto; }
  #lb img.wide { max-width: none; height: min(900px, 86vh); width: auto; }   /* tờ brochure rất dài: cho cuộn ngang để đọc được chữ */
  #vidDlg { width: min(960px, 96vw); padding: 0; border: 0; border-radius: 2px; background: #000; overflow: visible; }
  #vidDlg::backdrop { background: rgba(0,0,0,.75); }
  #vidDlg video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 2px; }
  .vid-close { position: absolute; top: -44px; right: 0; background: var(--paper-2); }

  @media (max-width: 820px) {
    :root { --margin: 0px; }
    .sheet { padding-left: 0; }
    .sheet::before { display: none; }
    .in-margin, .entry .in-margin { position: static; width: auto; text-align: left; }
    .sec-n { display: block; margin-bottom: 6px; }
    .sec-n small { display: inline; margin-left: 8px; }
    .entry .in-margin { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
    .head-grid { grid-template-columns: 1fr; gap: 28px; }
    .portrait { max-width: 260px; }
    dl.kfiles { grid-template-columns: 1fr; margin-left: 0; }
    dl.kfiles dt { margin-top: 6px; }
  }
  @media (max-width: 520px) {
    body { font-size: 17px; }
    .wrap { padding: 0 18px; }
    nav .wrap { gap: 12px; }
    nav .who span { display: none; }
    dl.facts, dl.skills, ul.alongside li { grid-template-columns: 1fr; }
    dl.facts dt { border-bottom: 0; padding-bottom: 0; }
    ol.commits li { grid-template-columns: 4.5em 1fr; }
    ol.commits time { grid-column: 2; }
  }
  @media print {
    nav, .textbtn, details.attach > summary { display: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a class="who" href="#top"><b>Nguyễn Quốc Anh Cường</b><span> · <span data-t="navNotebook"></span></span></a>
    <button class="textbtn" id="langBtn" aria-label="Language"></button>
    <button class="textbtn" id="themeBtn" aria-label="Theme"></button>
    <a href="cv/" data-t="navCV"></a>
  </div>
</nav>

<header class="first" id="top">
  <div class="wrap">
    <div class="head-grid">

/* ---- Brochure lật trang (giữ nguyên cách hoạt động) ----

let bookAt = 0;
const pageBg = (pg) => `background-image:url(${ME.nutrition.sheets[pg.sheet]});background-position:${pg.col / 3 * 100}% 0`;
function bookLabel() {
  const P = ME.nutrition.pages, n = P.length, a = bookAt * 2;
  if (a > n) return t(UI.bothSides);
  const shown = bookAt === 0 ? [1] : a >= n ? [n] : [a, a + 1];
  return `${shown.join("–")} / ${n} · ${shown.map((k) => t(P[k - 1].name)).join(" · ")}`;
}
function bookHTML() {
  const N = ME.nutrition, P = N.pages, leaves = P.length / 2;
  return `<div class="book-head"><h4>${t(N.title)}</h4><button class="icon-btn" data-close aria-label="${t(UI.close)}">✕</button></div>
    <p class="book-text">${t(N.text)}</p>
    <div class="book-stage" id="bookStage" data-sheets="false">
      <div class="book-wrap"><div class="book" id="book" data-at="0" data-end="false">
        ${Array.from({ length: leaves }, (_, i) => `<div class="leaf" data-leaf="${i}" style="z-index:${leaves - i}">
          <div class="face front" style="${pageBg(P[2 * i])}"></div><div class="face back" style="${pageBg(P[2 * i + 1])}"></div></div>`).join("")}
      </div></div>
      <div class="sheets">
        <figure><button class="zoom" data-zoom="${N.sheets.out}" data-wide="1"><img src="${N.sheets.out}" alt="${t(UI.sideOut)}"></button><figcaption>${t(UI.sideOut)}</figcaption></figure>
        <figure><button class="zoom" data-zoom="${N.sheets.in}" data-wide="1"><img src="${N.sheets.in}" alt="${t(UI.sideIn)}"></button><figcaption>${t(UI.sideIn)}</figcaption></figure>
      </div>
    </div>
    <div class="book-nav">
      <button data-flip="-1" disabled>${t(UI.prev)}</button>
      <span id="bookPos">${bookLabel()}</span>
      <button data-flip="1">${t(UI.nextStep)}</button>
    </div>`;
}
function openBook() { bookAt = 0; $("#bookBox").innerHTML = bookHTML(); $("#bookDlg").showModal(); }
function flipBook(dir) {
  const book = $("#book"), leaves = book.children.length, to = bookAt + dir;
  if (to < 0 || to > leaves + 1) return;
  if (to <= leaves && bookAt <= leaves) {
    const i = dir > 0 ? bookAt : bookAt - 1, leaf = book.children[i];
    leaf.style.zIndex = leaves + 1;
    leaf.classList.toggle("flipped", dir > 0);
    setTimeout(() => { leaf.style.zIndex = dir > 0 ? i + 1 : leaves - i; }, 350);
  }
  bookAt = to;
  book.dataset.at = Math.min(bookAt, leaves); book.dataset.end = bookAt >= leaves;
  $("#bookStage").dataset.sheets = bookAt > leaves;
  $("#bookPos").innerHTML = bookLabel();
  document.querySelector('[data-flip="-1"]').disabled = bookAt === 0;
  document.querySelector('[data-flip="1"]').disabled = bookAt === leaves + 1;
}

const REPO = "hoc-claude-code";
const ghUrl = (repo, path) => `https://github.com/${ME.github}/${repo}` + (path ? `/blob/HEAD/${path.split("/").map(encodeURIComponent).join("/")}` : "");
let gh = { state: "loading", repos: {}, commits: [], count: 0 };
function ago(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
  for (const [u, n] of [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]])
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(0, "minute");
}
const repoMeta = (repo) => gh.repos[repo] ? `${t(UI.updated)} ${esc(ago(gh.repos[repo]))}` : "";
function liveHTML() {
  if (gh.state === "loading") return `<p class="note">${t(UI.liveLoading)}</p>`;
  if (gh.state === "fail") return `<p class="note">${t(UI.liveFail)} <a href="${ghUrl("")}" target="_blank" rel="noopener">github.com/${esc(ME.github)}</a></p>`;
  const last = Object.values(gh.repos).sort().pop();
  return `<p class="gh-line">${gh.count} ${t(UI.repos)} · ${t(UI.lastPush)} ${esc(ago(last))}</p>
    <ol class="commits">${gh.commits.map((c) => `<li><code>${esc(c.sha)}</code><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.msg)}</a><time>${esc(ago(c.date))}</time></li>`).join("")}</ol>`;
}

// GitHub API công khai giới hạn 60 lần/giờ cho mỗi người xem, nên lưu tạm 30 phút.
async function loadGitHub() {
  const KEY = "portfolio-gh";
  let cached = null; try { cached = JSON.parse(store.get(KEY)); } catch {}
  if (cached && Date.now() - cached.at < 30 * 60 * 1000) { gh = cached.data; return paintGitHub(); }
  try {
    const [repos, commits] = await Promise.all([
      fetch(`https://api.github.com/users/${ME.github}/repos?per_page=100`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
      fetch(`https://api.github.com/repos/${ME.github}/${REPO}/commits?per_page=6`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
    ]);
    gh = { state: "ok", count: repos.length,
      repos: Object.fromEntries(repos.map((r) => [r.name, r.pushed_at])),
      commits: commits.map((c) => ({ sha: c.sha.slice(0, 7), msg: c.commit.message.split("\n")[0], date: c.commit.author.date, url: c.html_url })) };
    store.set(KEY, JSON.stringify({ at: Date.now(), data: gh }));
  } catch { gh = { ...gh, state: "fail" }; }
  paintGitHub();
}
function paintGitHub() {
  const live = $("#ghLive"); if (live) live.innerHTML = liveHTML();
  document.querySelectorAll(".ago[data-repo]").forEach((el) => el.innerHTML = repoMeta(el.dataset.repo));
}

  document.title = t(ME.name);
  $("#name").textContent = ME.name[L()];
  document.querySelectorAll("[data-t]").forEach((el) => el.innerHTML = t(UI[el.dataset.t]));
  const pc = UI.portraitCap[L()];
  $("#portraitCap").innerHTML = `<b>${esc(pc[0])}</b> ${esc(pc[1])}`;
  document.querySelector(".portrait img").alt = ME.name[L()];
  $("#toc").innerHTML = CHAPTERS.map((c, i) => `<li><a href="#${c.id}"><span class="num">§${i + 1}</span>${t(c.title)}<span class="dots"></span><i class="note">${t(c.note)}</i></a></li>`).join("");
  $("#langBtn").textContent = UI.langTo[L()];
  $("#themeBtn").textContent = UI.themeTo[theme][L()];
  $("#chapters").innerHTML = CHAPTERS.map((c, i) => `<section id="${c.id}"><div class="wrap"><div class="sheet">
      <div class="in-margin sec-n">§${i + 1}<small>${t(c.note)}</small></div>
      <h2>${t(c.title)}</h2>${c.intro ? `<p class="intro">${t(c.intro)}</p>` : ""}
      ${chapterBody(c.id)}
    </div></div></section>`).join("");
}

// Mọi cú bấm gắn một lần ở document, vì nội dung được vẽ lại khi đổi ngôn ngữ
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-flip]");
  if (nav) return flipBook(+nav.dataset.flip);
  const leaf = e.target.closest(".leaf");
  if (leaf) return flipBook(bookAt === $("#book").children.length || !leaf.classList.contains("flipped") ? 1 : -1);
  if (e.target.closest("[data-book]")) return openBook();
  if (e.target.closest("[data-close]") || e.target === $("#bookDlg")) return $("#bookDlg").close();
  const vid = e.target.closest("[data-video]");
  if (vid) { const v = $("#vidPlayer"); v.src = vid.dataset.video; v.poster = vid.dataset.poster; $("#vidDlg").showModal(); v.play().catch(() => {}); return; }
  const kall = e.target.closest("[data-kall]");
  if (kall) { const list = [...document.querySelectorAll(kall.dataset.kall)], open = !list.every((d) => d.open);
    list.forEach((d) => (d.open = open)); kall.textContent = t(open ? UI.closeAll : UI.openAll); return; }
  const zoom = e.target.closest("[data-zoom]");
  if (zoom) { const img = zoom.querySelector("img"); $("#lbImg").src = zoom.dataset.zoom; $("#lbImg").alt = img ? img.alt : ""; $("#lbImg").classList.toggle("wide", !!zoom.dataset.wide); $("#lb").showModal(); }
});
$("#lb").addEventListener("click", () => $("#lb").close());
$("#vidDlg").addEventListener("click", (e) => { if (e.target.id === "vidDlg" || e.target.closest("[data-vclose]")) $("#vidDlg").close(); });
$("#vidDlg").addEventListener("close", () => $("#vidPlayer").pause());

// Ngôn ngữ và "đèn bàn" (sáng/tối). Mặc định là giấy sáng, vì đó là chất của một cuốn sổ.
let theme = store.get("portfolio-theme") === "dark" ? "dark" : "light";
const applyTheme = () => document.documentElement.setAttribute("data-theme", theme);
applyTheme();
$("#langBtn").onclick = () => { lang = lang === "vi" ? "en" : "vi"; store.set("portfolio-lang", lang); render(); paintGitHub(); };
$("#themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("portfolio-theme", theme); applyTheme(); $("#themeBtn").textContent = UI.themeTo[theme][L()]; };

render();
loadGitHub();
</script>
</body>
</html>
