<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyễn Quốc Anh Cường</title>
<meta name="description" content="Nguyen Quoc Anh Cuong: research assistant in clinical neuroscience, biology tutor. A research notebook of posters, teaching and self-study.">
<meta property="og:title" content="Nguyễn Quốc Anh Cường · sổ tay nghiên cứu">
<meta property="og:description" content="Clinical neuroscience, posters, biology teaching and self-study, kept like a lab notebook.">
<meta property="og:image" content="https://ngqacuongg.github.io/img/portrait.jpg">
<!-- Newsreader: chữ in đủ dấu tiếng Việt. Patrick Hand: chữ viết tay cho ghi chú, giấy nhớ (có bộ chữ tiếng Việt). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     SỔ TAY NGHIÊN CỨU, bản "nhiều lớp giấy".
     Mặt bàn ở dưới cùng; mỗi mục là một trang giấy có lỗ gáy; trên trang là các lớp:
     thẻ ghi chú (index card), giấy nhớ, ảnh polaroid, băng dính, con dấu, băng nhãn Dymo, bưu thiếp.
     Nội dung chi tiết gói trong thẻ: bấm mới mở, để trang không thành một bản liệt kê dài.
     Hai màu mực lấy từ hình bài giảng Di truyền: xanh (từ bố), hồng (từ mẹ).
     ============================================================ */
  :root {
    --desk: #e3dac7; --paper: #fbf7ee; --card: #fffdf8; --ink: #1d2230; --soft: #59554c; --faint: #8b8577;
    --rule: #ddd3bf; --blue: #284a80; --rose: #b0446a; --grid: rgba(40, 74, 128, .05); --cardline: rgba(40, 74, 128, .15);
    --note-y: #f7e9a6; --note-b: #d3e3f3; --note-p: #f5d3de; --note-g: #d8e9cb; --kraft: #dcc7a2;
    --tape: rgba(244, 236, 210, .82); --shadow: 0 1px 1px rgba(0,0,0,.06), 0 14px 30px -22px rgba(30, 25, 10, .55);
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif; --hand: "Patrick Hand", "Comic Sans MS", cursive;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {   /* tắt đèn: mặt bàn gỗ sẫm, giấy ngả màu */
    --desk: #12110e; --paper: #201e19; --card: #282620; --ink: #ebe5d6; --soft: #b6ae9e; --faint: #8b8475;
    --rule: #3a362e; --blue: #93b3e6; --rose: #e58ca9; --grid: rgba(255,255,255,.025); --cardline: rgba(147, 179, 230, .16);
    --note-y: #4b4426; --note-b: #233650; --note-p: #4b2735; --note-g: #2c3e27; --kraft: #4b3e2b;
    --tape: rgba(130, 120, 95, .55); --shadow: 0 1px 1px rgba(0,0,0,.4), 0 16px 32px -20px rgba(0,0,0,.9);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 58px; }
  body { margin: 0; color: var(--ink); background: var(--desk) radial-gradient(rgba(0,0,0,.045) 1px, transparent 1.2px) 0 0 / 7px 7px;
         font: 18px/1.6 var(--serif); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { color: var(--rose); }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
  button { font: inherit; color: inherit; }
  .textbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--blue); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-align: left; }
  .textbtn:hover { color: var(--rose); }
  .hand { font-family: var(--hand); font-weight: 400; }
  .note { font-size: 15px; font-style: italic; color: var(--soft); }
  .tape { position: absolute; width: 86px; height: 24px; background: var(--tape); border: 1px solid rgba(0,0,0,.05); z-index: 3; }

  /* thanh trên cùng */
  nav.top { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--desk) 88%, transparent); backdrop-filter: blur(6px); }
  nav.top .in { max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 50px; display: flex; align-items: center; gap: 20px; font-size: 15px; }
  nav.top .who { margin-right: auto; color: var(--ink); text-decoration: none; font-weight: 600; }
  nav.top .who i { font-weight: 400; color: var(--soft); }
  nav.top .in > * { white-space: nowrap; }
  nav.top .who { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  /* thẻ chia mục ở mép phải */
  .tabs { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 35; display: flex; flex-direction: column; gap: 5px; }
  .tabs a { display: flex; align-items: baseline; gap: 10px; padding: 7px 14px 7px 12px; min-width: 170px; text-decoration: none; color: var(--ink);
            border-radius: 7px 0 0 7px; box-shadow: var(--shadow); transform: translateX(calc(100% - 46px)); transition: transform .25s ease; font-size: 15px; }
  .tabs a b { font: 600 12px var(--mono); width: 22px; color: var(--rose); }
  .tabs a:hover, .tabs a.on { transform: translateX(0); }
  .tabs a.on { box-shadow: var(--shadow), inset 3px 0 0 var(--rose); }
  .tabs a:nth-child(4n+1) { background: var(--note-y); } .tabs a:nth-child(4n+2) { background: var(--note-b); }
  .tabs a:nth-child(4n+3) { background: var(--note-p); } .tabs a:nth-child(4n+4) { background: var(--note-g); }

  /* trang giấy: lỗ gáy bên trái, một tờ nữa lấp ló phía sau */
  .page { position: relative; isolation: isolate; max-width: 1080px; margin: 70px auto; padding: 54px 64px 60px 92px;
          background: var(--paper) ; box-shadow: var(--shadow); }
  .page::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
                  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  .page::after { content: ""; position: absolute; inset: 6px -6px -8px 8px; z-index: -2; background: var(--card); box-shadow: var(--shadow); transform: rotate(.7deg); }
  .page:nth-of-type(even)::after { transform: rotate(-.8deg); inset: 8px 8px -8px -6px; }
  .holes { position: absolute; left: 26px; top: 30px; bottom: 30px; width: 16px; pointer-events: none;
           background: radial-gradient(circle at 8px 8px, var(--desk) 6px, rgba(0,0,0,.12) 7px, transparent 7.5px) 0 0 / 16px 58px repeat-y; }
  .margin-line { position: absolute; left: 62px; top: 0; bottom: 0; width: 1px; background: var(--rose); opacity: .35; }
  .pg-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .pg-head .n { font: 13px var(--mono); color: var(--rose); }
  h2 { margin: 0; font-weight: 500; font-size: clamp(30px, 3.8vw, 40px); line-height: 1.1; letter-spacing: -.01em; }
  .scribble { font-family: var(--hand); color: var(--rose); font-size: 21px; transform: rotate(-2deg); display: inline-block; }
  .intro { margin: 6px 0 30px; color: var(--soft); max-width: 40em; font-style: italic; }
  h3.lbl { margin: 0 0 10px; font: 400 21px var(--hand); color: var(--soft); }

  /* ---- trang đầu: cuốn sổ mở hai trang ---- */
  .spread { position: relative; isolation: isolate; max-width: 1080px; margin: 40px auto 30px; display: grid; grid-template-columns: 1fr 1fr; box-shadow: var(--shadow); }
  .spread > div { position: relative; background: var(--paper); min-height: 640px; padding: 54px 52px; }
  .spread > div::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
                          background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  .spread > div > * { position: relative; z-index: 1; }
  .spread .gutter { position: absolute; top: 0; bottom: 0; left: 50%; width: 60px; margin-left: -30px; z-index: 2; pointer-events: none;
                    background: linear-gradient(90deg, transparent, rgba(0,0,0,.09) 46%, rgba(0,0,0,.14) 50%, rgba(0,0,0,.09) 54%, transparent); }
  .polaroid { position: relative; width: 62%; margin: 6px 0 0 4%; background: #fffefb; padding: 12px 12px 46px; box-shadow: var(--shadow); transform: rotate(-3deg); }
  .polaroid img { display: block; width: 100%; height: auto; }
  .polaroid .tape { top: -12px; left: 50%; margin-left: -43px; transform: rotate(3deg); }
  .polaroid figcaption { position: absolute; left: 14px; right: 14px; bottom: 10px; font: 19px/1.2 var(--hand); color: #3b3a36; }
  .now-card { position: absolute !important; right: 30px; bottom: 30px; width: 54%; background: var(--card); padding: 34px 18px 16px; box-shadow: var(--shadow); transform: rotate(2.2deg);
              background-image: linear-gradient(var(--rose), var(--rose)), repeating-linear-gradient(transparent 0 25px, var(--cardline) 25px 26px);
              background-size: 100% 1px, 100% 100%; background-position: 0 28px, 0 30px; background-repeat: no-repeat, repeat; font-size: 15px; line-height: 26px; }
  .now-card b { position: absolute; top: 4px; left: 18px; font: 19px var(--hand); color: var(--rose); }
  .now-card p { margin: 0; }
  .stamp { position: absolute !important; right: 34px; top: 58px; width: 116px; height: 116px; border-radius: 50%; border: 3px double var(--rose); color: var(--rose);
           display: grid; place-items: center; text-align: center; font: 600 11px/1.3 var(--mono); letter-spacing: .08em; transform: rotate(-14deg); opacity: .78; padding: 14px; }
  .eyebrow { margin: 0; font: 21px var(--hand); color: var(--faint); transform: rotate(-1.5deg); display: inline-block; }
  h1 { margin: 8px 0 6px; font-weight: 500; font-size: clamp(40px, 4.8vw, 60px); line-height: 1.02; letter-spacing: -.015em; }
  .role { margin: 0; color: var(--soft); font-style: italic; }
  .lead { margin: 18px 0 0; font-size: 20px; line-height: 1.5; }
  .notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 30px; }
  .sticky { position: relative; display: block; padding: 14px 14px 16px; min-height: 120px; color: #2a2720; text-decoration: none; box-shadow: var(--shadow);
            font: 19px/1.25 var(--hand); transition: transform .2s ease; }
  :root[data-theme="dark"] .sticky { color: var(--ink); }
  .sticky small { display: block; margin-top: 6px; font: 14px/1.35 var(--serif); font-style: italic; opacity: .85; }
  .sticky:nth-child(1) { background: var(--note-y); transform: rotate(-2deg); } .sticky:nth-child(2) { background: var(--note-b); transform: rotate(1.5deg); }
  .sticky:nth-child(3) { background: var(--note-p); transform: rotate(-1deg); }
  .sticky:hover { transform: rotate(0) translateY(-4px); color: inherit; }
  .head-links { margin: 26px 0 0; font-size: 16px; }

  /* ---- 1. mình là ai ---- */
  .about-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 44px; align-items: start; }
  .lede { margin: 0 0 24px; font-size: 20px; line-height: 1.55; }
  .lede::first-letter { float: left; font-size: 3.2em; line-height: .86; padding: 6px 8px 0 0; color: var(--rose); font-weight: 500; }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .step { position: relative; background: var(--card); padding: 16px 16px 16px 46px; box-shadow: var(--shadow); font-size: 15.5px; line-height: 1.5; }
  .step::before { content: attr(data-n); position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--rose); color: var(--rose);
                  display: grid; place-items: center; font: 13px var(--mono); }
  .step h4 { margin: 0 0 4px; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .step p { margin: 0; color: var(--soft); }
  .icard { position: relative; background: var(--card); padding: 40px 20px 18px; box-shadow: var(--shadow); line-height: 28px; font-size: 15.5px;
           background-image: linear-gradient(var(--rose), var(--rose)), repeating-linear-gradient(transparent 0 27px, var(--cardline) 27px 28px);
           background-size: 100% 1px, 100% 100%; background-position: 0 32px, 0 33px; background-repeat: no-repeat, repeat; }
  .icard > b.t { position: absolute; top: 6px; left: 20px; font: 20px var(--hand); color: var(--rose); }
  .icard .tape { top: -12px; right: 30px; transform: rotate(-4deg); }
  .icard dl { margin: 0; } .icard dt { font-style: italic; color: var(--faint); float: left; width: 6.8em; } .icard dd { margin: 0 0 0 7em; }
  .side { display: grid; gap: 26px; }
  .roles-card { transform: rotate(.8deg); }
  .roles-card p { margin: 0; } .roles-card p + p { margin-top: 0; }
  .roles-card em { color: var(--blue); font-style: normal; font-weight: 600; }
  blockquote.goal { position: relative; margin: 34px 0 0; padding: 22px 26px 22px 70px; background: var(--note-y); box-shadow: var(--shadow); transform: rotate(-.5deg); max-width: 820px; }
  blockquote.goal::before { content: "“"; position: absolute; left: 18px; top: -6px; font-size: 90px; line-height: 1; color: var(--rose); opacity: .7; }
  blockquote.goal p { margin: 0; font: 23px/1.35 var(--hand); color: #2a2720; }
  :root[data-theme="dark"] blockquote.goal p { color: var(--ink); }
  blockquote.goal cite { display: block; margin-top: 6px; font: 13px var(--mono); color: var(--soft); font-style: normal; }

  /* ---- 2. hành trình: timeline zigzag quanh một đường gáy ---- */
  .tl { position: relative; display: grid; grid-template-columns: 1fr 1fr; column-gap: 96px; padding: 10px 0 70px; }
  .tl::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px dashed var(--rose); opacity: .5; }
  .jc { position: relative; margin-bottom: 34px; }
  .jc:nth-child(even) { margin-top: 90px; margin-bottom: -56px; }
  .jc .pin { position: absolute; top: 18px; width: 100px; padding: 4px 8px; background: var(--card); box-shadow: var(--shadow); font: 12px var(--mono); text-align: center; color: var(--soft); z-index: 2; }
  .jc:nth-child(odd) .pin { right: -98px; transform: rotate(3deg); } .jc:nth-child(even) .pin { left: -98px; transform: rotate(-3deg); }
  .jc .pin::after { content: ""; position: absolute; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--rose); }
  .jc:nth-child(odd) .pin::after { left: 50%; margin-left: 39px; } .jc:nth-child(even) .pin::after { right: 50%; margin-right: 39px; }
  .jc.now .pin { color: var(--rose); font-weight: 600; }
  .jcard { position: relative; background: var(--card); box-shadow: var(--shadow); padding: 42px 20px 18px; font-size: 15.5px; line-height: 1.5;
           background-image: linear-gradient(var(--rose), var(--rose)); background-size: 100% 1px; background-position: 0 34px; background-repeat: no-repeat; transition: transform .2s ease; }
  .jc:nth-child(odd) .jcard { transform: rotate(-.6deg); } .jc:nth-child(even) .jcard { transform: rotate(.6deg); }
  .jc:hover .jcard { transform: rotate(0); }
  .jcard .kind { position: absolute; top: 8px; left: 20px; font: 18px var(--hand); color: var(--rose); }
  .jc.later .jcard { background: transparent; box-shadow: none; outline: 2px dashed var(--rule); }
  .jcard h3 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.3; }
  .jcard .org { margin: 1px 0 8px; font-style: italic; color: var(--soft); font-size: 15px; }
  .jcard ul { margin: 0; padding-left: 1em; color: var(--ink); }
  .jcard li { margin-bottom: 3px; } .jcard li::marker { content: "– "; color: var(--faint); }
  .stack { position: relative; display: flex; align-items: center; gap: 22px; width: 100%; margin-top: 14px; padding: 6px 0 0; background: none; border: 0; cursor: pointer; text-align: left; }
  .stack .pile { position: relative; flex: none; width: 112px; height: 128px; }
  .stack .pile img { position: absolute; left: 10px; top: 4px; width: 88px; height: 112px; object-fit: cover; object-position: top; background: #fff; padding: 5px 5px 14px;
                     box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 8px 14px -10px rgba(0,0,0,.5); transition: transform .25s ease; }
  .stack .pile img:nth-child(1) { transform: rotate(-9deg) translate(-8px, 4px); } .stack .pile img:nth-child(2) { transform: rotate(5deg) translate(8px, 0); }
  .stack .pile img:nth-child(3) { transform: rotate(-1deg); }
  .stack:hover .pile img:nth-child(1) { transform: rotate(-16deg) translate(-18px, 6px); } .stack:hover .pile img:nth-child(2) { transform: rotate(12deg) translate(20px, 2px); }
  .stack .lab { font: 19px/1.25 var(--hand); color: var(--blue); }
  .stack .lab small { display: block; font: italic 14px var(--serif); color: var(--soft); }
  .along { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .along div { background: var(--note-g); padding: 12px 14px; box-shadow: var(--shadow); font-size: 15px; line-height: 1.45; }
  .along div:nth-child(2) { background: var(--note-b); transform: rotate(1deg); } .along div:nth-child(1) { transform: rotate(-1deg); }
  .along time { display: block; font: 12px var(--mono); color: var(--soft); }

  /* ---- 3. nghiên cứu ---- */
  .qs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 34px; }
  .q { position: relative; padding: 16px 16px 20px; min-height: 170px; box-shadow: var(--shadow); font: 20px/1.3 var(--hand); color: #2a2720; }
  :root[data-theme="dark"] .q { color: var(--ink); }
  .q b { display: block; font: 600 12px var(--mono); color: var(--rose); margin-bottom: 8px; }
  .q:nth-child(1) { background: var(--note-y); transform: rotate(-2.5deg); } .q:nth-child(2) { background: var(--note-b); transform: rotate(1.5deg) translateY(10px); }
  .q:nth-child(3) { background: var(--note-p); transform: rotate(-1deg); } .q:nth-child(4) { background: var(--note-g); transform: rotate(2.2deg) translateY(6px); }
  .clip { position: relative; max-width: 760px; margin: 10px auto 0; background: var(--card); box-shadow: var(--shadow); padding: 36px 28px 22px; border-top: 4px solid var(--kraft); }
  .clip::before { content: ""; position: absolute; top: -16px; left: 50%; width: 120px; height: 26px; margin-left: -60px; background: linear-gradient(#a7a39a, #77736b); border-radius: 6px 6px 3px 3px; }
  .clip ul { margin: 0; padding-left: 1.1em; } .clip li { margin-bottom: 6px; } .clip li::marker { content: "☐  "; color: var(--faint); }

  /* ---- 4. dạy học: 13 thẻ học ---- */
  .tally { font: 20px var(--hand); color: var(--soft); margin: -10px 0 22px; }
  .kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .kc { position: relative; text-align: left; background: var(--card); border: 0; padding: 14px 14px 16px; box-shadow: var(--shadow); cursor: pointer; min-height: 150px;
        display: flex; flex-direction: column; transition: transform .2s ease; }
  .kc:nth-child(3n+1) { transform: rotate(-1deg); } .kc:nth-child(3n+2) { transform: rotate(.8deg); }
  .kc:hover { transform: rotate(0) translateY(-5px); }
  .kc .kn { font: 500 34px/1 var(--serif); color: var(--rose); }
  .kc .kt { margin-top: 8px; font-size: 15.5px; line-height: 1.35; flex: 1; }
  .kc .km { margin-top: 10px; font: 11px var(--mono); color: var(--faint); letter-spacing: .02em; }
  .kc::after { content: ""; position: absolute; top: 0; right: 0; border-width: 0 16px 16px 0; border-style: solid; border-color: var(--paper) var(--paper) var(--rule) var(--rule); }
  #kDlg { width: min(720px, 94vw); }
  dl.kfiles { display: grid; grid-template-columns: 8em 1fr; gap: 8px 14px; margin: 14px 0 0; font-size: 16px; }
  dl.kfiles dt { font: 18px var(--hand); color: var(--soft); }
  dl.kfiles dd { margin: 0; }
  dl.kfiles .sep { color: var(--faint); }
  ol.ab { list-style: none; margin: 0; padding: 0; } ol.ab li { display: grid; grid-template-columns: 3.4em 1fr; } ol.ab b { font: 12px/2 var(--mono); color: var(--faint); font-weight: 400; }

  /* ---- 5. tự học: bìa hồ sơ ---- */
  .folders { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; padding-top: 18px; }
  .folder { position: relative; background: var(--kraft); padding: 22px 20px 20px; box-shadow: var(--shadow); color: #2b2418; }
  :root[data-theme="dark"] .folder { color: var(--ink); }
  .folder::before { content: attr(data-tab); position: absolute; top: -26px; left: 0; height: 26px; padding: 4px 16px 0; background: var(--kraft); border-radius: 8px 8px 0 0; font: 16px var(--hand); }
  .folder:nth-child(2) { background: var(--note-g); } .folder:nth-child(2)::before { background: var(--note-g); }
  .folder:nth-child(3) { background: var(--note-p); } .folder:nth-child(3)::before { background: var(--note-p); }
  .folder h3 { margin: 0 0 6px; font-size: 19px; line-height: 1.3; font-weight: 600; }
  .folder p { margin: 0 0 12px; font-size: 15px; line-height: 1.5; }
  .folder .sheet { background: var(--card); padding: 10px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.1); transform: rotate(-.6deg); }
  .folder ul { list-style: none; margin: 0; padding: 0; font-size: 15px; }
  ol.lessons { list-style: none; margin: 0; padding: 0; font-size: 15px; }

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let lang = store.get("portfolio-lang") || (navigator.language.startsWith("vi") ? "vi" : "en");
const L = () => (lang === "vi" ? 0 : 1);
const t = (x) => Array.isArray(x) ? esc(x[L()]) : esc(x ?? "");
const fmtDate = (d) => esc(d.replace("nay", lang === "vi" ? "nay" : "now"));

let FIGS = [];          // mọi hình trên trang, theo thứ tự
function figOf(it) {
  if (it.p === "poster") return { ...ME.posters[it.i] };
  if (it.p === "brochure") return { ...ME.nutrition, book: true };
  return { ...it };
}
function buildFigs() {
  FIGS = [];
  ME.journey.forEach((j, ji) => (j.items || []).forEach((it) => FIGS.push({ ...figOf(it), ji, n: FIGS.length + 1 })));
}

  const f = gal.list[gal.i], j = ME.journey[f.ji];
  const cap = `<span class="fig-n">${t(UI.figure)} ${f.n}.</span> ${t(f.title)}${/[?.!]$/.test(f.title[L()] || "") ? "" : "."} <em>${t(f.where)}</em>${f.award ? `<span class="award">${t(f.award)}</span>` : ""}`;
  $("#galBox").innerHTML = `<div class="dlg-head"><h4>${t(j.title)}</h4><button class="icon-btn" data-gclose aria-label="${t(UI.close)}">✕</button></div>
    ${f.book ? `<img class="gal-img" src="${esc(f.thumb)}" alt="${t(f.title)}" data-book style="cursor:pointer">`
             : `<img class="gal-img" src="${esc(f.img || f.thumb)}" alt="${t(f.title)}" data-zoom="${esc(f.img || f.thumb)}">`}
    <p class="gal-cap">${cap}${f.book ? ` <button class="textbtn" data-book>${t(UI.openBook)} →</button>` : ""}</p>
    <div class="dlg-nav"><button class="textbtn" data-gstep="-1" ${gal.i === 0 ? "disabled" : ""}>${t(UI.prev)}</button>
      <span class="note">${gal.i + 1} / ${gal.list.length}</span>
      <button class="textbtn" data-gstep="1" ${gal.i === gal.list.length - 1 ? "disabled" : ""}>${t(UI.nextStep)}</button></div>`;
}

          <h3>${t(j.title)}</h3><p class="org">${t(j.org)}</p>
          <ul>${j.points.map((p) => `<li>${t(p)}</li>`).join("")}</ul>
          ${figs.length ? `<button class="stack" data-gal="${ji}"><span class="pile">${pile}</span>
            <span class="lab">${UI.attached[L()](figs.length)}<small>${t(UI.seeFigs)} →</small></span></button>` : ""}
        </article></div>`;
    }).join("")}</div>
    <h3 class="lbl">${t(UI.alongsideTitle)}</h3>
    <div class="along">${ME.alongside.map(([d, x]) => `<div><time>${fmtDate(d)}</time>${t(x)}</div>`).join("")}</div>`;
}

/* ---- Brochure lật trang (giữ nguyên cách hoạt động) ---- */
let bookAt = 0;
const pageBg = (pg) => `background-image:url(${ME.nutrition.sheets[pg.sheet]});background-position:${pg.col / 3 * 100}% 0`;
function bookLabel() {
  const P = ME.nutrition.pages, n = P.length, a = bookAt * 2;
  if (a > n) return t(UI.bothSides);
  const shown = bookAt === 0 ? [1] : a >= n ? [n] : [a, a + 1];
  return `${shown.join("–")} / ${n} · ${shown.map((k) => t(P[k - 1].name)).join(" · ")}`;
}
function bookHTML() {
  const N = ME.nutrition, P = N.pages, leaves = P.length / 2;
  return `<div class="book-head"><h4>${t(N.title)}</h4><button class="icon-btn" data-close aria-label="${t(UI.close)}">✕</button></div>
    <p class="book-text">${t(N.text)}</p>
    <div class="book-stage" id="bookStage" data-sheets="false">
      <div class="book-wrap"><div class="book" id="book" data-at="0" data-end="false">
        ${Array.from({ length: leaves }, (_, i) => `<div class="leaf" data-leaf="${i}" style="z-index:${leaves - i}">
          <div class="face front" style="${pageBg(P[2 * i])}"></div><div class="face back" style="${pageBg(P[2 * i + 1])}"></div></div>`).join("")}
      </div></div>
      <div class="sheets">
        <figure><button class="zoom" data-zoom="${N.sheets.out}" data-wide="1"><img src="${N.sheets.out}" alt="${t(UI.sideOut)}"></button><figcaption>${t(UI.sideOut)}</figcaption></figure>
        <figure><button class="zoom" data-zoom="${N.sheets.in}" data-wide="1"><img src="${N.sheets.in}" alt="${t(UI.sideIn)}"></button><figcaption>${t(UI.sideIn)}</figcaption></figure>
      </div>
    </div>
    <div class="book-nav">
      <button data-flip="-1" disabled>${t(UI.prev)}</button>
      <span id="bookPos">${bookLabel()}</span>
      <button data-flip="1">${t(UI.nextStep)}</button>
    </div>`;
}
function openBook() { if ($("#galDlg").open) $("#galDlg").close(); bookAt = 0; $("#bookBox").innerHTML = bookHTML(); $("#bookDlg").showModal(); }
function flipBook(dir) {
  const book = $("#book"), leaves = book.children.length, to = bookAt + dir;
  if (to < 0 || to > leaves + 1) return;
  if (to <= leaves && bookAt <= leaves) {
    const i = dir > 0 ? bookAt : bookAt - 1, leaf = book.children[i];
    leaf.style.zIndex = leaves + 1;
    leaf.classList.toggle("flipped", dir > 0);
    setTimeout(() => { leaf.style.zIndex = dir > 0 ? i + 1 : leaves - i; }, 350);
  }
  bookAt = to;
  book.dataset.at = Math.min(bookAt, leaves); book.dataset.end = bookAt >= leaves;
  $("#bookStage").dataset.sheets = bookAt > leaves;
  $("#bookPos").innerHTML = bookLabel();
  document.querySelector('[data-flip="-1"]').disabled = bookAt === 0;
  document.querySelector('[data-flip="1"]').disabled = bookAt === leaves + 1;
}

/* ---- 4. Dạy học: 13 thẻ học, bấm mở bảng tài liệu của K đó ---- */
const inK = (x, k) => k >= x.ks[0] && k <= x.ks[1];
function kFiles(k) {
  const T = ME.tutor, ab = [3 * k - 2, 3 * k - 1, 3 * k];
  const join = (arr) => arr.length ? arr.join(`<span class="sep"> · </span>`) : `<span class="note">${t(UI.none)}</span>`;
  const link = (x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${t(x.name)}</a>`;
  return {
    visual: T.lessons.filter((x) => inK(x, k)).map((x) => `<a href="${esc(x.url)}#k${k}" target="_blank" rel="noopener">Visual K${k} · ${esc(T.tools[k - 1])}</a>`),
    slides: T.slides.filter((x) => inK(x, k)).map(link), cheats: T.cheats.filter((x) => inK(x, k)).map(link),
    videos: T.videos.filter((v) => inK(v, k)).map((v) => `<button class="textbtn" data-video="${esc(v.src)}" data-poster="${esc(v.poster)}">${t(v.name)}</button>`),
    ab, join,
  };
}
function openK(k) {
  const T = ME.tutor, f = kFiles(k), n = T.stages.length;
  $("#kBox").innerHTML = `<div class="dlg-head"><h4><span style="color:var(--rose)">K${k}</span> · ${t(T.stages[k - 1])}</h4><button class="icon-btn" data-kclose aria-label="${t(UI.close)}">✕</button></div>
    <dl class="kfiles">
      <dt>${t(UI.kVisual)}</dt><dd>${f.join(f.visual)}</dd>
      <dt>${t(UI.kSlides)}</dt><dd>${f.join(f.slides)}</dd>
      <dt>${t(UI.kCheat)}</dt><dd>${f.join(f.cheats)}</dd>
      <dt>${t(UI.kVideo)}</dt><dd>${f.join(f.videos)}</dd>
      <dt>${t(UI.kSheets)}</dt><dd><ol class="ab">${f.ab.map((a) => `<li><b>AB${a}</b><span>${esc(T.worksheets[a - 1])}</span></li>`).join("")}</ol></dd>
    </dl>
    <div class="dlg-nav"><button class="textbtn" data-kopen="${k - 1}" ${k === 1 ? "disabled" : ""}>← K${k - 1}</button>
      <span class="note">${t(UI.sheetNote)}</span>
      <button class="textbtn" data-kopen="${k + 1}" ${k === n ? "disabled" : ""}>K${k + 1} →</button></div>`;
  if (!$("#kDlg").open) $("#kDlg").showModal();
}
function tutorHTML() {
  const T = ME.tutor, n = T.stages.length, decks = T.slides.filter((x) => /slides/i.test(x.name[1])).length;
  const tally = lang === "vi"
    ? `${n} thẻ · ${T.tools.length} visual tương tác · ${decks} bộ slides · ${T.cheats.length} cheat sheet · ${T.videos.length} video · ${T.worksheets.length} phiếu bài tập`
    : `${n} cards · ${T.tools.length} interactive visuals · ${decks} slide decks · ${T.cheats.length} cheat sheets · ${T.videos.length} videos · ${T.worksheets.length} worksheets`;
  return `<p class="intro" style="font-style:normal;color:var(--ink)"><b>${t(T.title)}.</b> ${t(T.text)}</p>
    <p class="tally">${tally}</p>
    <div class="kgrid">${T.stages.map((st, i) => {
      const k = i + 1, f = kFiles(k);
      const m = [f.visual.length && t(UI.kVisual), f.slides.length && "slides", f.cheats.length && "cheat", f.videos.length && "video", "3 AB"].filter(Boolean).join(" · ");
      return `<button class="kc" data-kopen="${k}"><span class="kn">K${k}</span><span class="kt">${t(st)}</span><span class="km">${m}</span></button>`;
    }).join("")}</div>`;
}

/* ---- 6. Học code (GitHub lấy trực tiếp khi mở trang) ---- */
const REPO = "hoc-claude-code";
const ghUrl = (repo, path) => `https://github.com/${ME.github}/${repo}` + (path ? `/blob/HEAD/${path.split("/").map(encodeURIComponent).join("/")}` : "");
let gh = { state: "loading", repos: {}, commits: [], count: 0 };
function ago(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
  for (const [u, n] of [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]])
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(0, "minute");
}
const repoMeta = (repo) => gh.repos[repo] ? `${t(UI.updated)} ${esc(ago(gh.repos[repo]))}` : "";
function liveHTML() {
  if (gh.state === "loading") return `<p>${t(UI.liveLoading)}</p>`;
  if (gh.state === "fail") return `<p>${t(UI.liveFail)} <a href="${ghUrl("")}" target="_blank" rel="noopener">github.com/${esc(ME.github)}</a></p>`;
  const last = Object.values(gh.repos).sort().pop();
  return `<ol>${gh.commits.map((c) => `<li><code>${esc(c.sha)}</code> <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.msg)}</a><br><span style="color:#888">${esc(ago(c.date))}</span></li>`).join("")}</ol>
    <div class="dash"></div><div class="tot"><span>${t(UI.repos)}</span><b>${gh.count}</b></div><div class="tot"><span>${t(UI.lastPush)}</span><b>${esc(ago(last))}</b></div>
    <div class="dash"></div><p style="text-align:center;margin:0">${t(UI.thanks)}</p>`;
}
function codeHTML() {
  const school = ME.school.map((c) => `<details class="course"><summary><b>${t(c.title)}</b> <span class="ago" data-repo="${esc(c.repo)}">${repoMeta(c.repo)}</span><small>${t(c.text)}</small></summary>
      <ol class="nb">${c.items.map((i) => `<li><a href="${ghUrl(c.repo, i.path)}" target="_blank" rel="noopener">${t(i.label)}</a></li>`).join("")}</ol></details>`).join("");
  const build = ME.build.map((b) => `<li><b>${t(b.title)}</b> · ${t(b.text)}<br>
      ${b.noPreview ? `<span class="note">${t(UI.here)}</span> · ` : b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">${t(UI.open)}</a> · ` : ""}<a href="https://github.com/${ME.github}/${b.repo || REPO}/tree/HEAD/${esc(b.code)}" target="_blank" rel="noopener">${t(UI.source)}</a></li>`).join("");
  return `<div class="code-grid">
    <div class="codecol"><h3 class="lbl">${t(UI.schoolTitle)}</h3>${school}</div>
    <div class="codecol" style="transform:rotate(-.6deg)"><h3 class="lbl">${t(UI.buildTitle)}</h3><ul class="tools-list">${build}</ul></div>
    <div class="receipt"><h4>${t(UI.receiptTitle)}</h4><div style="text-align:center">github.com/${esc(ME.github)}</div><div class="dash"></div><div id="ghLive">${liveHTML()}</div></div>
  </div>`;
}
async function loadGitHub() {   // API công khai giới hạn 60 lần/giờ cho mỗi người xem, nên lưu tạm 30 phút
  const KEY = "portfolio-gh";
  let cached = null; try { cached = JSON.parse(store.get(KEY)); } catch {}
  if (cached && Date.now() - cached.at < 30 * 60 * 1000) { gh = cached.data; return paintGitHub(); }
  try {
    const [repos, commits] = await Promise.all([
      fetch(`https://api.github.com/users/${ME.github}/repos?per_page=100`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
      fetch(`https://api.github.com/repos/${ME.github}/${REPO}/commits?per_page=5`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
    ]);
    gh = { state: "ok", count: repos.length, repos: Object.fromEntries(repos.map((r) => [r.name, r.pushed_at])),
      commits: commits.map((c) => ({ sha: c.sha.slice(0, 7), msg: c.commit.message.split("\n")[0], date: c.commit.author.date, url: c.html_url })) };
    store.set(KEY, JSON.stringify({ at: Date.now(), data: gh }));
  } catch { gh = { ...gh, state: "fail" }; }
  paintGitHub();
}
function paintGitHub() {
  const live = $("#ghLive"); if (live) live.innerHTML = liveHTML();
  document.querySelectorAll(".ago[data-repo]").forEach((el) => el.innerHTML = repoMeta(el.dataset.repo));
}

/* ---- Nội dung từng trang ---- */
function chapterBody(id) {
  switch (id) {
    case "about": return `<div class="about-grid">
        <div><p class="lede">${t(ME.bioLead)}</p>
          <h3 class="lbl">${t(UI.storyTitle)}</h3>
          <div class="steps">${ME.story.map((b, i) => `<div class="step" data-n="${i + 1}"><h4>${t(b.title)}</h4><p>${t(b.text)}</p></div>`).join("")}</div></div>
        <div class="side">
          <div class="icard"><span class="tape"></span><b class="t">${t(UI.factsTitle)}</b><dl>${ME.facts.map(([k, v]) => `<dt>${t(k)}</dt><dd>${t(v)}</dd>`).join("")}</dl></div>
          <div class="icard roles-card"><b class="t">${t(UI.rolesTitle)}</b>${ME.roles.map((r) => `<p><em>${t(r.title)}.</em> ${t(r.text)}</p>`).join("")}</div>
        </div></div>
      <blockquote class="goal"><p>${t(ME.goal)}</p><cite>— ${t(UI.goalTitle)}</cite></blockquote>`;
    case "journey": return journeyHTML();
    case "research": return `<div class="qs">${ME.interests.map((x, i) => `<div class="q"><b>${t(UI.qLabel)} ${i + 1}</b>${t(x)}</div>`).join("")}</div>
      <div class="clip"><h3 class="lbl">${t(UI.studiesTitle)}</h3><ul>${ME.studies.map((s) => `<li>${t(s)}</li>`).join("")}</ul></div>`;
    case "teach": return tutorHTML();
    case "learn": return `<div class="folders">${ME.learn.map((w) => `<article class="folder" data-tab="${t(w.who)}"><h3>${t(w.title)}</h3><p>${t(w.text)}</p>
        <div class="sheet"><ol class="lessons">${w.lessons.map((l) => `<li><span class="ln">${t(UI.lessonN)} ${l.n}</span><span class="lt">${t(l.title)}</span>
          <span class="ll"><a href="${esc(l.lesson)}" target="_blank" rel="noopener">${t(UI.lessonLink)}</a> · <a href="${esc(l.practice)}" target="_blank" rel="noopener">${t(UI.practiceLink)}</a></span></li>`).join("")}</ol></div></article>`).join("")}</div>
      <p class="note" style="margin-top:26px">${t(UI.privateNote)}</p>`;
    case "code": return codeHTML();
    case "skills": return `<div class="skillrows">${ME.skills.map(([g, list], gi) => `<div><h3 class="lbl">${t(g)}</h3>${list.map((s) => `<span class="dymo ${/Đang học|In development/.test(g[1]) || gi === 2 ? "learning" : ""}">${esc(s)}</span>`).join("")}</div>`).join("")}</div>`;
    case "contact": return `<div class="postcard">
        <div class="msg">${t(UI.postMsg)}<small>${t(UI.postSmall)}</small></div>
        <div class="addr"><div class="pstamp"><img src="img/portrait.jpg" alt=""></div><div class="postmark">${UI.postmark[L()]}</div>
          ${ME.emails.map((m) => `<p><a href="mailto:${esc(m.address)}">${esc(m.address)}</a></p>`).join("")}
          ${ME.links.map((l) => `<p><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></p>`).join("")}
          <p><a href="cv/">${t(UI.readCV)}</a></p></div>
      </div>`;
  }
}

function render() {
  buildFigs();
  document.documentElement.lang = lang;
  document.title = t(ME.name);
  $("#name").textContent = ME.name[L()];
  document.querySelectorAll("[data-t]").forEach((el) => el.innerHTML = t(UI[el.dataset.t]));
  $("#portraitCap").textContent = UI.portraitCap[L()];
  $("#stamp").innerHTML = UI.stamp[L()];
  document.querySelector(".polaroid img").alt = ME.name[L()];
  $("#notes").innerHTML = UI.notes.map((n) => `<a class="sticky" href="${n.href}">${t(n.t)}<small>${t(n.s)}</small></a>`).join("");
  $("#tabs").innerHTML = CHAPTERS.map((c, i) => `<a href="#${c.id}" data-id="${c.id}"><b>§${i + 1}</b>${t(c.tab)}</a>`).join("");
  $("#langBtn").textContent = UI.langTo[L()];
  $("#themeBtn").textContent = UI.themeTo[theme][L()];
  $("#chapters").innerHTML = CHAPTERS.map((c, i) => `<section class="page" id="${c.id}"><span class="holes" aria-hidden="true"></span><span class="margin-line" aria-hidden="true"></span>
      <div class="pg-head"><span class="n">§${i + 1}</span><h2>${t(c.title)}</h2>${c.scribble ? `<span class="scribble">${t(c.scribble)}</span>` : ""}</div>
      ${c.intro ? `<p class="intro">${t(c.intro)}</p>` : `<div style="height:22px"></div>`}
      ${chapterBody(c.id)}
    </section>`).join("");
  watchTabs();
}

// Thẻ chia mục: đánh dấu trang đang đọc
let tabObs;
function watchTabs() {
  tabObs?.disconnect();
  tabObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) document.querySelectorAll("#tabs a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("section.page").forEach((s) => tabObs.observe(s));
}

// Mọi cú bấm gắn một lần ở document, vì nội dung được vẽ lại khi đổi ngôn ngữ
document.addEventListener("click", (e) => {
  const q = (sel) => e.target.closest(sel);
  if (q("[data-flip]")) return flipBook(+q("[data-flip]").dataset.flip);
  if (q(".leaf")) return flipBook(bookAt === $("#book").children.length || !q(".leaf").classList.contains("flipped") ? 1 : -1);
  if (q("[data-book]")) return openBook();
  if (q("[data-close]") || e.target === $("#bookDlg")) return $("#bookDlg").close();
  if (q("[data-gal]")) return openGallery(+q("[data-gal]").dataset.gal);
  if (q("[data-gstep]")) { gal.i += +q("[data-gstep]").dataset.gstep; return drawGallery(); }
  if (q("[data-gclose]") || e.target === $("#galDlg")) return $("#galDlg").close();
  if (q("[data-kopen]")) return openK(+q("[data-kopen]").dataset.kopen);
  if (q("[data-kclose]") || e.target === $("#kDlg")) return $("#kDlg").close();
  const vid = q("[data-video]");
  if (vid) { const v = $("#vidPlayer"); v.src = vid.dataset.video; v.poster = vid.dataset.poster; $("#vidDlg").showModal(); v.play().catch(() => {}); return; }
  const zoom = q("[data-zoom]");
  if (zoom) { $("#lbImg").src = zoom.dataset.zoom; $("#lbImg").alt = zoom.alt || ""; $("#lbImg").classList.toggle("wide", !!zoom.dataset.wide); $("#lb").showModal(); }
});
document.addEventListener("keydown", (e) => {   // phím mũi tên để lật ảnh trong bộ xem
  if ($("#galDlg").open && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const d = e.key === "ArrowRight" ? 1 : -1, n = gal.i + d;
    if (n >= 0 && n < gal.list.length) { gal.i = n; drawGallery(); }
  }
});
$("#lb").addEventListener("click", () => $("#lb").close());
$("#vidDlg").addEventListener("click", (e) => { if (e.target.id === "vidDlg" || e.target.closest("[data-vclose]")) $("#vidDlg").close(); });
$("#vidDlg").addEventListener("close", () => $("#vidPlayer").pause());

// Ngôn ngữ và đèn bàn (sáng/tối). Mặc định giấy sáng.
let theme = store.get("portfolio-theme") === "dark" ? "dark" : "light";
const applyTheme = () => document.documentElement.setAttribute("data-theme", theme);
applyTheme();
$("#langBtn").onclick = () => { lang = lang === "vi" ? "en" : "vi"; store.set("portfolio-lang", lang); render(); paintGitHub(); };
$("#themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; store.set("portfolio-theme", theme); applyTheme(); $("#themeBtn").textContent = UI.themeTo[theme][L()]; };

render();
loadGitHub();
</script>
